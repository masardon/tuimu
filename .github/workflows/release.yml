name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          PACKAGE_DIR="tuimu-linux-${{ matrix.arch }}"
          mkdir -p "$PACKAGE_DIR"
          cp target/${{ matrix.target }}/release/tuimu "$PACKAGE_DIR/"
          cp README.md LICENSE clean-cache.sh install.sh "$PACKAGE_DIR/"
          tar -czf "tuimu-linux-${{ matrix.arch }}.tar.gz" "$PACKAGE_DIR/"

      - uses: actions/upload-artifact@v4
        with:
          name: tuimu-linux-${{ matrix.arch }}
          path: tuimu-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tuimu-linux-*.tar.gz
          generate_release_notes: true
